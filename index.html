<!doctype html><html lang="es"><meta charset="utf-8"><title>Consulta</title><style>body{font-family:Arial} .top{display:flex;justify-content:space-between;align-items:center}.blue{background:#0b5ea8;color:#fff;padding:10px;text-align:center}.box{max-width:800px;margin:auto}.ok{border:1px solid #0a0;padding:10px}.bad{color:red;font-size:40px;text-align:center}</style><div class=box><div class=top><img src="https://autogestion.mppe.gob.ve/static/media/logo_gob.be0cbc4c855a742a7df3d1fd9cfcc926.svg" height=70><div>Ministerio del Poder Popular para la Educación.<br>República Bolivariana de Venezuela</div><img src="GREMIODOCENTE(1).jpg" height=90></div><div class=blue><b>Listado de Prestaciones por Incapacidad<br>Fecha: Mayo 2026<br>Trabajadores del Mppe Incapacitados</b></div><h3>Escribe tu Cédula de Identidad</h3><input id=c><button onclick=q()>Consultar</button><p>Puedes escribir con puntos (12.345.678) o sin ellos (12345678).</p><div id=r></div></div><script>let d=[];fetch("data.json").then(r=>r.json()).then(j=>d=j);function q(){let v=c.value.replace(/\./g,"");let x=d.find(e=>String(e.CEDULA)==v);if(x)r.innerHTML=`<div class=ok><b>NOMBRES Y APELLIDOS:</b> ${x["NOMBRES Y APELLIDOS"]}<br><b>ESTADO:</b> ${x.ESTADO}<br><b>TIPO:</b> ${x["TIPO DE PERSONAL"]}<br><b>RESOLUCIÓN:</b> ${x.RERSOLUCION}<br><b>FECHA:</b> ${x.FECHA}</div>`;else r.innerHTML=`<div class=bad>✘</div><p>Usted no aparece en la lista. La cédula ${v} no se encuentra registrada en el Listado de Prestaciones por Incapacidad de MAYO 2026.</p>`}</script>
